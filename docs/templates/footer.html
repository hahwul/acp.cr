<script>
(function () {
  var KEY = "hwaro-theme";
  var MODES = ["auto", "light", "dark"];
  var root = document.documentElement;
  var btn = document.querySelector(".theme-toggle");
  if (!btn) return;
  function apply(mode) {
    if (mode === "auto") {
      root.removeAttribute("data-theme");
      try { localStorage.removeItem(KEY); } catch (e) {}
    } else {
      root.setAttribute("data-theme", mode);
      try { localStorage.setItem(KEY, mode); } catch (e) {}
    }
    btn.setAttribute("data-mode", mode);
    btn.setAttribute("aria-label", "Theme: " + mode);
    btn.title = "Theme: " + mode;
  }
  var stored = "auto";
  try { var t = localStorage.getItem(KEY); if (t === "light" || t === "dark") stored = t; } catch (e) {}
  btn.addEventListener("click", function () {
    apply(MODES[(MODES.indexOf(btn.getAttribute("data-mode")) + 1) % MODES.length]);
  });
  apply(stored);
})();
(function () {
  var btn = document.querySelector(".nav-toggle");
  var scrim = document.querySelector(".sidebar-scrim");
  var sidebar = document.getElementById("sidebar");
  if (!btn) return;
  function set(open) {
    document.body.classList.toggle("nav-open", open);
    btn.setAttribute("aria-expanded", open ? "true" : "false");
  }
  btn.addEventListener("click", function () {
    set(!document.body.classList.contains("nav-open"));
  });
  if (scrim) scrim.addEventListener("click", function () { set(false); });
  if (sidebar) sidebar.addEventListener("click", function (e) {
    if (e.target.closest("a")) set(false);
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") set(false);
  });
})();
</script>
